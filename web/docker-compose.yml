services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Обязательный build-arg (fail-fast в Dockerfile). Для деплоя переопределить
        # реальным доменом: NEXT_PUBLIC_SITE_URL=https://<домен> docker compose build.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    image: alye-parusa-web
    container_name: alye-parusa-web
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
